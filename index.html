<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>🔐 Random Password Generator</h1>
        <p>Create a strong and secure password</p>

        <form method="POST">

            <label for="length">Password Length</label>

            <input
                type="number"
                name="length"
                id="length"
                min="4"
                max="50"
                value="12"
                required
            >

            <div class="presets">
                <button type="button" onclick="setLength(8)">8</button>
                <button type="button" onclick="setLength(12)">12</button>
                <button type="button" onclick="setLength(16)">16</button>
                <button type="button" onclick="setLength(20)">20</button>
            </div>

            <h3>Character Options</h3>

            <div class="options">

                <label>
                    <input type="checkbox" name="uppercase" checked>
                    Uppercase Letters (A-Z)
                </label>

                <label>
                    <input type="checkbox" name="lowercase" checked>
                    Lowercase Letters (a-z)
                </label>

                <label>
                    <input type="checkbox" name="numbers" checked>
                    Numbers (0-9)
                </label>

                <label>
                    <input type="checkbox" name="symbols" checked>
                    Symbols (!@#$)
                </label>

            </div>

            <button type="submit">Generate Password</button>

        </form>

        {% if password %}
        <div class="result">

            <h3>Your Password</h3>

            <div class="password-box"
                 data-password="{{ password }}"
                 data-hidden="false">
                {{ password }}
            </div>

            <button onclick="togglePassword()">👁️ Show / Hide Password</button>

            <button onclick="copyPassword()">Copy Password</button>

            <h3>Password Strength</h3>

            <div class="strength-box">
                {{ strength }}
            </div>

        </div>
        {% endif %}

        {% if history %}
        <div class="history">

            <h3>Password History</h3>

            {% for item in history %}
            <div class="history-item">
                {{ item }}
            </div>
            {% endfor %}

            <form method="POST" action="/clear-history">
                <button type="submit">🗑️ Clear History</button>
            </form>

        </div>
        {% endif %}

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
