<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>🛡️ Admin Login</h1>

        <p>Administrator access</p>


        {% if message %}

        <p style="color: red; font-weight: bold;">
            {{ message }}
        </p>

        {% endif %}


        <form method="POST">

            <label for="username">
                Admin Username
            </label>

            <input
                type="text"
                name="username"
                id="username"
                placeholder="Enter admin username"
                required
            >


            <label for="password">
                Admin Password
            </label>

            <input
                type="password"
                name="password"
                id="password"
                placeholder="Enter admin password"
                required
            >


            <button type="submit">
                Admin Login
            </button>

        </form>


        <p>
            <a href="/login">
                User Login
            </a>
        </p>

    </div>

</body>

</html>
