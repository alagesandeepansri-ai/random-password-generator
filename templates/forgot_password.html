```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="container">

    <h1>🔑 Forgot Password</h1>

    <p>
        Reset your password using your registered details.
    </p>


    {% if message %}

    <p style="
        color:
        {% if 'successful' in message %}
            #2e7d32
        {% else %}
            #e53935
        {% endif %};

        text-align:center;
        font-weight:bold;

        background:
        {% if 'successful' in message %}
            #e8f5e9
        {% else %}
            #ffebee
        {% endif %};

        padding:12px;
        border-radius:8px;
    ">
        {{ message }}
    </p>

    {% endif %}


    <form
        method="POST"
        action="/forgot-password"
    >


        <!-- EMAIL OR MOBILE -->

        <label for="login">
            Email or Mobile Number
        </label>

        <input
            type="text"
            id="login"
            name="login"
            placeholder="Enter registered email or mobile number"
            autocomplete="email"
            required
        >


        <!-- DATE OF BIRTH -->

        <label for="dob">
            Date of Birth
        </label>

        <input
            type="date"
            id="dob"
            name="dob"
            required
        >


        <!-- NEW PASSWORD -->

        <label for="new_password">
            New Password
        </label>

        <input
            type="password"
            id="new_password"
            name="new_password"
            placeholder="Enter new password"
            required
        >


        <!-- CONFIRM PASSWORD -->

        <label for="confirm_password">
            Confirm New Password
        </label>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Confirm new password"
            required
        >


        <!-- RESET PASSWORD BUTTON -->

        <button
            type="submit"
            style="
                width:100%;
                height:48px;
                font-size:16px;
            "
        >

            🔄 Reset Password

        </button>


    </form>


    <!-- BACK TO LOGIN -->

    <p
        style="
            text-align:center;
            margin-top:20px;
        "
    >

        <a href="/login">
            ← Back to Login
        </a>

    </p>


</div>

</body>

</html>
```
