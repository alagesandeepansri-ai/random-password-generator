<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>👤 User Registration</h1>

        <p>Create your account</p>


        {% if message %}

        <p style="color: red; font-weight: bold;">
            {{ message }}
        </p>

        {% endif %}


        <form method="POST">


            <label for="name">
                Name
            </label>

            <input
                type="text"
                name="name"
                id="name"
                placeholder="Enter your name"
                required
            >


            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                name="email"
                id="email"
                placeholder="Enter your email address"
            >


            <label for="mobile">
                Mobile Number
            </label>

            <input
                type="tel"
                name="mobile"
                id="mobile"
                placeholder="Enter your mobile number"
                maxlength="10"
            >


            <label for="dob">
                Date of Birth
            </label>

            <input
                type="date"
                name="dob"
                id="dob"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                name="password"
                id="password"
                placeholder="Create your password"
                required
            >


            <button type="submit">
                Register
            </button>

        </form>


        <p>
            Already have an account?
            <a href="/login">Login</a>
        </p>

    </div>


    <script
        src="{{ url_for('static', filename='script.js') }}">
    </script>

</body>

</html>
