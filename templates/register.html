```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="container">

    <h1>📝 User Registration</h1>

    <p>
        Create an account to use the Secure Password Generator.
    </p>


    {% if message %}

    <p style="
        color:
        {% if 'successful' in message %}
            #2e7d32
        {% else %}
            #e53935
        {% endif %};

        text-align:center;
        font-weight:bold;

        background:
        {% if 'successful' in message %}
            #e8f5e9
        {% else %}
            #ffebee
        {% endif %};

        padding:12px;
        border-radius:8px;
    ">
        {{ message }}
    </p>

    {% endif %}


    <form method="POST">


        <!-- NAME -->

        <label for="name">
            Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required
        >


        <!-- EMAIL -->

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
        >


        <!-- MOBILE -->

        <label for="mobile">
            Mobile Number
        </label>

        <input
            type="tel"
            id="mobile"
            name="mobile"
            placeholder="Enter your mobile number"
        >


        <!-- DATE OF BIRTH -->

        <label for="dob">
            Date of Birth
        </label>

        <input
            type="date"
            id="dob"
            name="dob"
            required
        >


        <!-- PASSWORD -->

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            required
        >


        <!-- REGISTER BUTTON -->

        <button
            type="submit"
            style="
                width:100%;
                height:48px;
                font-size:16px;
            "
        >

            📝 Register

        </button>


    </form>


    <!-- LOGIN LINK -->

    <p
        style="
            text-align:center;
            margin-top:20px;
        "
    >

        Already have an account?

        <a href="/login">
            Login
        </a>

    </p>


</div>

</body>

</html>
```
