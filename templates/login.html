<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>🔐 User Login</h1>

        <p>Login to use the Password Generator</p>


        {% if message %}

        <p style="color: red;">
            {{ message }}
        </p>

        {% endif %}


        <form method="POST">

            <label for="login_value">
                Email or Mobile Number
            </label>

            <input
                type="text"
                name="login_value"
                id="login_value"
                placeholder="Enter email or mobile number"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                name="password"
                id="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <p>
            Don't have an account?
            <a href="/register">Register</a>
        </p>

    </div>

</body>

</html>
