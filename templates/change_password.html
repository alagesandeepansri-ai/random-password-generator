```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="container">

    <h1>🔑 Change Password</h1>

    <p>
        Update your account password securely.
    </p>


    {% if message %}

    <p style="
        color:
        {% if 'successfully' in message %}
            #2e7d32
        {% else %}
            #e53935
        {% endif %};

        text-align:center;
        font-weight:bold;

        background:
        {% if 'successfully' in message %}
            #e8f5e9
        {% else %}
            #ffebee
        {% endif %};

        padding:12px;
        border-radius:8px;
    ">
        {{ message }}
    </p>

    {% endif %}


    <form method="POST">


        <!-- CURRENT PASSWORD -->

        <label for="current_password">
            Current Password
        </label>

        <input
            type="password"
            id="current_password"
            name="current_password"
            placeholder="Enter your current password"
            required
        >


        <!-- NEW PASSWORD -->

        <label for="new_password">
            New Password
        </label>

        <input
            type="password"
            id="new_password"
            name="new_password"
            placeholder="Enter your new password"
            required
        >


        <!-- CONFIRM NEW PASSWORD -->

        <label for="confirm_password">
            Confirm New Password
        </label>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Confirm your new password"
            required
        >


        <!-- CHANGE PASSWORD BUTTON -->

        <button
            type="submit"
            style="
                width:100%;
                height:48px;
                font-size:16px;
            "
        >

            🔄 Change Password

        </button>


    </form>


    <!-- BACK TO DASHBOARD -->

    <p
        style="
            text-align:center;
            margin-top:20px;
        "
    >

        <a href="/">
            ← Back to Password Generator
        </a>

    </p>


</div>

</body>

</html>
```
