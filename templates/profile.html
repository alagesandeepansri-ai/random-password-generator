<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>My Profile</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">
```

</head>

<body>

```
<div class="dashboard">

    <div class="top-bar">

        <div>

            <h1>👤 My Profile</h1>

            <p>View your account information</p>

        </div>

        <div class="menu-container">

            <a href="/" style="text-decoration: none;">

                <button
                    type="button"
                    class="menu-button">

                    ←

                </button>

            </a>

        </div>

    </div>


    <div class="generator-card">

        <h2>Account Details</h2>

        <br>


        <label>Name</label>

        <input
            type="text"
            value="{{ user['name'] }}"
            readonly
        >


        <label>Email Address</label>

        <input
            type="text"
            value="{{ user['email'] or 'Not provided' }}"
            readonly
        >


        <label>Mobile Number</label>

        <input
            type="text"
            value="{{ user['mobile'] or 'Not provided' }}"
            readonly
        >


        <label>Date of Birth</label>

        <input
            type="text"
            value="{{ user['dob'] }}"
            readonly
        >


        <a href="/">

            <button
                type="button"
                style="width: 100%; padding: 12px;">

                🏠 Back to Dashboard

            </button>

        </a>

    </div>

</div>
```

</body>

</html>
